<body>
  <header id="site-header"></header>
  <main id="main">
    <noscript>
      <section class="section"><h2>L3 进阶技术</h2>
      <p>转身：触壁到蹬壁的一条线；出发：安全边界优先；配速与周期化：量化训练；动作自查：侧面与正面录制对照清单，并把视频带给持证教练复盘。</p></section>

  <script src="content.js"></script>
  <script src="app.js"></script>
  <script>
    function pageRender() {
      document.title = u("advanced_title") + " · " + u("brand");
      setMetaDesc(t(CONTENT.advanced.meta));

      var mods = CONTENT.advanced.modules.map(function (m) {
        var pts = m.points.map(function (p) { return "<li>" + esc(t(p)) + "</li>"; }).join("");
        return '<article class="card module-card">' +
          '<h3>' + esc(t(m.title)) + '</h3>' +
          '<ul class="point-list">' + pts + '</ul>' +
          '<p class="sec drill"><strong>' + u("drill_l") + '：</strong>' + esc(t(m.drills)) + '</p>' +
          safetyLinksHtml(m.related) + '</article>';
      }).join("");

      document.getElementById("main").innerHTML =
        '<section class="section"><h2>' + u("advanced_title") + '</h2>' +
        '<p class="sub">' + esc(t(CONTENT.advanced.intro)) + '</p>' +
        '<div class="note-banner"><strong>' + u("safety_first") + '：</strong>' + esc(t(CONTENT.advanced.note)) + '</div>' +
        '<div class="module-list">' + mods + '</div>' +
        '<section class="next-block"><h3>' + u("next_steps") + '</h3>' +
        nextLinksHtml(CONTENT.advanced.next) + '</section></section>';
    }
    initChrome("", pageRender);
  </script>
