<body>
  <header id="site-header"></header>
  <main id="main">
    <noscript>
      <section class="section"><h2>下水前 5 课 · L0 零基础</h2>
      <p>适应水与扶边、水中呼气与吐泡、扶边俯漂与自主站立、仰漂与呼救、扶边移动与轻打腿。全程浅水区，有成人或教练陪同。</p>

  <script src="content.js"></script>
  <script src="app.js"></script>
  <script>
    function pageRender() {
      document.title = fill(u("basics_title"), CONTENT.basics.lessons.length) + " · " + u("brand");
      setMetaDesc(fill(t(CONTENT.basics.meta), CONTENT.basics.lessons.length));

      var lessons = CONTENT.basics.lessons.map(function (l, i) {
        var steps = l.steps.map(function (s) { return "<li>" + esc(t(s)) + "</li>"; }).join("");
        return '<article class="card lesson-card">' +
          '<div class="lesson-head"><span class="lesson-no">' + (i + 1) + '</span>' +
          '<h3>' + esc(t(l.title)) + '</h3></div>' +
          '<p class="sec"><strong>' + u("goal_l") + '：</strong>' + esc(t(l.goal)) + '</p>' +
          '<p class="sub-label">' + u("steps_l") + '</p>' +
          '<ol class="lesson-steps">' + steps + '</ol>' +
          '<p class="sec lesson-fix"><strong>' + u("fix") + '：</strong>' + esc(t(l.mistake)) + '</p>' +
          safetyLinksHtml(l.related) + '</article>';
      }).join("");

      document.getElementById("main").innerHTML =
        '<section class="section"><h2>' + fill(u("basics_title"), CONTENT.basics.lessons.length) + '</h2>' +
        '<p class="sub">' + esc(fill(t(CONTENT.basics.intro), CONTENT.basics.lessons.length)) + '</p>' +
        '<div class="note-banner"><strong>' + u("safety_first") + '：</strong>' + esc(t(CONTENT.basics.note)) + '</div>' +
        '<div class="lesson-list">' + lessons + '</div>' +
        '<section class="next-block"><h3>' + u("next_steps") + '</h3>' +
        nextLinksHtml(CONTENT.basics.next) + '</section></section>';
    }
    initChrome("", pageRender);
  </script>
